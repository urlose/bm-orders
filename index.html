<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Заказы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bundesmarket · Заказы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📦%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#1f6feb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--mute:#9aa3af;--line:#2a2f38;--acc:#4c8dff;--chip:#232833}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
header #out{padding:6px 10px;font-size:13px}
header b{flex:1}
main{max-width:760px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
button,.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:var(--chip);color:var(--ink)}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}
button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--chip);color:var(--ink);white-space:nowrap;padding:7px 12px;font-size:14px;border-radius:999px;flex:none}
.tabs button.on{background:var(--acc);color:#fff}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600}
.chip.late{background:#fde2e2;color:#991b1b}
.mute{color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .v{font-size:20px;font-weight:700}
.o{cursor:pointer}
.o h4{margin:0 0 4px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog .in{padding:16px;max-height:86vh;overflow:auto}
img.ph{max-width:100%;border-radius:10px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0}
@media(min-width:600px){.stats{grid-template-columns:repeat(6,1fr)}}
.stats button{display:flex;flex-direction:column;justify-content:flex-start;min-height:64px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:left;font-weight:400}
.stats button b{display:block;font-size:22px;line-height:1.1}
.stats button span{font-size:12px;color:var(--mute)}
.stats button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;justify-content:flex-end;background:none;color:var(--mute);padding:6px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.bnav button i{font-style:normal;font-size:20px;line-height:1}
.bnav button.on{color:var(--acc)}
.bnav button.add i{background:var(--acc);color:#fff;border-radius:12px;width:40px;height:28px;display:flex;align-items:center;justify-content:center}
.o h4{flex:1;min-width:0}
input,select,textarea{font-size:16px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
.hidden{display:none}
.warn{background:#fff7e6;border:1px solid #f5c26b;color:#7a4b00;border-radius:12px;padding:10px;margin:10px 0}
@media (prefers-color-scheme:dark){.warn{background:#2b2312;border-color:#7a5a1e;color:#f5d48f}}
.tl{margin:6px 0;padding-left:0;list-style:none}.tl li{padding:4px 0;border-bottom:1px dashed var(--line)}.tl li:last-child{border:0}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font-size:24px;padding:16px 0;border-radius:14px}
</style>
</head>
<body>
<header><b>📦 Заказы</b><span id="who" class="mute"></span><button id="out" class="ghost hidden">Выйти</button></header>
<main id="app"></main>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div id="toast"></div>

<script>
const API = "https://jegfxrwsjxsizurfebej.supabase.co/functions/v1/ops";
const STAGES = [
  ["ordered","Заказ принят"],["purchased","Оформлен в магазине"],["shipped","Едет к работнику"],
  ["received","У работника"],["airport","Сдан на рейс"],["arrived","В Таджикистане"],["done","Выдан клиенту"],["cancelled","Отменён"]];
const SL = Object.fromEntries(STAGES);
const EXP = {flight:"Авиа / перевозка",worker:"Оплата работнику",local_delivery:"Доставка в ТJ",other:"Другое"};
let S = {pin:null, me:null, data:null, tab:"orders", filter:"active", period:"month"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round((+n||0)*100)/100).toLocaleString("ru-RU");
const d = s => s ? new Date(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}) : "";
const toast = t => { const e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",2500); };
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};

async function call(action, extra={}) {
  const r = await fetch(API, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({pin:S.pin, action, ...extra})});
  const j = await r.json().catch(()=>({error:"Нет связи"}));
  if (!r.ok || j.error) throw new Error(j.error || "Ошибка");
  return j;
}

/* ---------- login ---------- */
function loginView(msg="") {
  $("#who").textContent=""; $("#out").classList.add("hidden");
  let pin = "";
  $("#app").innerHTML = `<div style="max-width:320px;margin:24px auto;text-align:center">
    <h3>Введите PIN</h3>
    <div id="dots" style="display:flex;gap:12px;justify-content:center;margin:16px 0"></div>
    <p id="pmsg" class="mute" style="color:var(--bad);min-height:20px">${esc(msg)}</p>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"✓"].map(k=>`<button data-k="${k}" class="${k==="✓"?"":"ghost"}">${k}</button>`).join("")}</div></div>`;
  const dots = () => $("#dots").innerHTML = Array.from({length:Math.max(6,pin.length)},(_,i)=>`<span style="width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);background:${i<pin.length?"var(--acc)":"transparent"}"></span>`).join("");
  const go = async () => { if(!pin) return; S.pin = pin; $("#pmsg").textContent="Проверяю…";
    try { await load(); store.set("bm_pin", S.pin); } catch(e){ S.pin=null; loginView(e.message); } };
  document.querySelectorAll(".pad button").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k==="⌫") pin = pin.slice(0,-1); else if (k==="✓") return go(); else if (pin.length<12) pin += k;
    dots(); if (pin.length===6) go();
  });
  document.onkeydown = e => { if(!$("#dots")) return; if(/^\d$/.test(e.key) && pin.length<12){pin+=e.key;dots(); if(pin.length===6) go();} else if(e.key==="Backspace"){pin=pin.slice(0,-1);dots();} else if(e.key==="Enter") go(); };
  dots();
}
function trackUrl(o) {
  const n = encodeURIComponent((o.tracking_no||"").trim()), c = (o.carrier||"").toLowerCase(), t = (o.tracking_no||"").toUpperCase();
  if (!n) return null;
  if (c.includes("dhl") || /^(JJD|JVGL|00340)/.test(t)) return "https://www.dhl.de/de/privatkunden/pakete-empfangen/verfolgen.html?piececode="+n;
  if (c.includes("hermes")) return "https://www.myhermes.de/empfangen/sendungsverfolgung/sendungsinformation#"+n;
  if (c.includes("dpd")) return "https://tracking.dpd.de/status/de_DE/parcel/"+n;
  if (c.includes("gls")) return "https://gls-group.com/DE/de/paketverfolgung?match="+n;
  if (c.includes("ups") || /^1Z/.test(t)) return "https://www.ups.com/track?tracknum="+n;
  if (c.includes("amazon")) return "https://track.amazon.de/tracking/"+n;
  return "https://parcelsapp.com/ru/tracking/"+n;
}
const trackBtn = o => { const u = trackUrl(o); return u ? `<a class="btn" style="background:var(--chip);color:var(--ink);text-decoration:none;display:inline-block" href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 Где посылка?</a>` : ""; };
$("#out").onclick = () => { store.set("bm_pin", null); S.pin=null; loginView(); };

async function load() {
  S.data = await call("list"); S.me = S.data.me;
  if (S.me.role==="admin" && S.data.settings && S.data.settings.mail_parser!=="2" && !S.reproc) {
    S.reproc = true;
    try { toast("Навожу порядок в письмах…"); await call("reprocess_mail"); S.data = await call("list"); } catch(e){ console.warn(e); }
  }
  $("#who").textContent = S.me.name; $("#out").classList.remove("hidden");
  render();
}
function render() { S.me.role==="worker" ? workerView() : mainView(); }

/* ---------- helpers ---------- */
const paidOf = id => (S.data.payments||[]).filter(p=>p.order_id===id).reduce((a,p)=>a+ +p.amount_tjs,0);
const rate = () => +(S.data.settings?.eur_tjs||11.5);
const lateDays = o => {
  if (["ordered","done","cancelled"].includes(o.stage)) return 0;
  const days = (Date.now()-new Date(o.stage_at))/864e5, lim = +(S.data.settings?.delay_days||5);
  return days > lim ? Math.floor(days) : 0;
};
const stageChip = o => { const l = lateDays(o); return `<span class="chip ${l?"late":""}">${SL[o.stage]}${l?` · ${l} дн.`:""}</span>`; };

/* ---------- worker ---------- */
function workerView() {
  const os = S.data.orders;
  const wait = os.filter(o=>["purchased","shipped"].includes(o.stage)), have = os.filter(o=>o.stage==="received");
  const card = (o,btns) => `<div class="card"><h4 style="margin:0">№${o.num} · ${esc(o.items)}</h4>
    <div class="mute">${esc(o.client_name)} ${o.shop?"· "+esc(o.shop):""} ${o.carrier?"· "+esc(o.carrier):""} ${o.tracking_no?"· "+esc(o.tracking_no):""}</div>
    ${o.parcel_delivered_at?`<div><b>📬 Доставлено службой ${d(o.parcel_delivered_at)}</b> — проверьте и подтвердите получение</div>`:""}
    ${o.photo_url?`<img class="ph" src="${o.photo_url}" loading="lazy">`:""}<div class="row" style="margin-top:10px">${btns(o)}${trackBtn(o)}</div></div>`;
  $("#app").innerHTML = `<h3>Ожидаются (${wait.length})</h3>
    ${wait.map(o=>card(o,o=>`<button class="ok" onclick="receive('${o.id}')">📦 Получил + фото</button>`)).join("")||'<p class="mute">Пока ничего не ожидается</p>'}
    <h3>У меня (${have.length})</h3>
    ${have.map(o=>card(o,o=>`<button onclick="setStage('${o.id}','airport')">✈️ Сдал на рейс</button>${o.photo_url?"":`<button class="ghost" onclick="receive('${o.id}')">Добавить фото</button>`}`)).join("")||'<p class="mute">Пусто</p>'}`;
}
function pickPhoto() {
  return new Promise(res => {
    const i = document.createElement("input"); i.type="file"; i.accept="image/*"; i.capture="environment";
    i.onchange = () => { const f=i.files[0]; if(!f) return res(null);
      const img=new Image(); img.onload=()=>{ const k=Math.min(1,1280/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=img.width*k; c.height=img.height*k;
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.7)); URL.revokeObjectURL(img.src); };
      img.src=URL.createObjectURL(f); };
    i.click();
  });
}
async function receive(id) {
  const photo = await pickPhoto(); if (!photo) return toast("Фото не выбрано");
  toast("Загружаю…");
  try { await call("set_stage",{id, stage:"received", photo}); toast("Готово ✓"); await load(); } catch(e){ toast(e.message); }
}
async function setStage(id, stage) {
  const o = (S.data.orders||[]).find(x=>x.id===id);
  if (stage==="purchased" && o && !o.shop_order_no && S.me.role!=="worker") {
    const no = prompt("№ заказа в магазине (из письма-подтверждения).\nПо нему письма о доставке привяжутся сами. Можно оставить пустым.");
    if (no===null) return;
    if (no.trim()) { try { const r = await call("save_order",{order:{id, shop_order_no:no.trim()}}); if(r.matched) toast(`Привязано писем: ${r.matched}`); } catch(e){ return toast(e.message); } }
  }
  try { await call("set_stage",{id, stage}); toast("Сохранено ✓"); $("#dlg").open && $("#dlg").close(); await load(); } catch(e){ toast(e.message); }
}

/* ---------- main (admin / seller) ---------- */
function mainView() {
  const admin = S.me.role==="admin";
  const tabs = [["orders","📋","Заказы"],["new","+","Продажа"]].concat(admin?[["money","💶","Деньги"],["settings","⚙️","Настройки"]]:[]);
  $("#app").innerHTML = `<div id="tab"></div><nav class="bnav">${tabs.map(([k,ic,l])=>`<button class="${S.tab===k?"on":""} ${k==="new"?"add":""}" onclick="S.tab='${k}';render();scrollTo(0,0)"><i>${ic}</i>${l}</button>`).join("")}</nav>`;
  ({orders:ordersTab, new:()=>orderForm(), money:moneyTab, settings:settingsTab})[S.tab]();
}

function ordFilters() {
  const late = S.data.orders.filter(lateDays), fresh = S.data.orders.filter(isFresh), dups = S.data.orders.filter(o=>dupsOf(o).length);
  return {...(dups.length?{dups:[`⚠️ Дубли (${dups.length})`,o=>dupsOf(o).length]}:{}),...(fresh.length?{fresh:[`🆕 Из почты (${fresh.length})`,isFresh]}:{}), active:["Активные",o=>!["done","cancelled"].includes(o.stage)], late:[`Задержки (${late.length})`,o=>lateDays(o)],
    debt:["Долги",o=>o.stage!=="cancelled" && +o.sale_tjs-paidOf(o.id)>0.009], all:["Все",()=>true],
    mail:[`✉️ Письма (${mailGroupsUnmatched().length})`,()=>false]};
}
const isFresh = o => o.auto_created && !o.client_name && o.stage!=="cancelled";
function listHtml() {
  if (S.filter==="mail") return mailsHtml();
  const F = ordFilters(), q = (S.q||"").toLowerCase();
  if (!S.filter.startsWith("st:") && !F[S.filter]) S.filter = "active";
  const flt = S.filter.startsWith("st:") ? (o=>o.stage===S.filter.slice(3)) : F[S.filter][1];
  const hint = S.filter==="dups" ? '<p class="mute">Эти заказы похожи друг на друга (тот же № магазина, трек или тот же магазин и клиент в те же дни). Откройте заказ и нажмите «Объединить», если это один и тот же заказ.</p>' : S.filter==="fresh" ? '<p class="mute">Эти заказы созданы сами из писем магазинов. Откройте заказ и укажите клиента и цену в TJS. Если это не заказ Bundesmarket — нажмите «Отменён».</p>' : "";
  const list = S.data.orders.filter(flt).filter(o=>!q || [o.client_name,o.client_phone,o.items,o.tracking_no,o.shop_order_no,o.num].join(" ").toLowerCase().includes(q));
  return hint + list.map(o=>{ const debt=+o.sale_tjs-paidOf(o.id); return `<div class="card o" onclick="openOrder('${o.id}')">
      <div class="row"><h4>№${o.num} · ${o.client_name?esc(o.client_name):'<span style="color:var(--warn)">❓ укажите клиента</span>'}</h4>${stageChip(o)}</div>
      <div>${o.shop?`<b>${esc(o.shop)}</b> · `:""}${esc(o.items)}${o.shop_order_no?` <span class="mute">(№ ${esc(o.shop_order_no)})</span>`:""}</div>
      ${mailLine(o)}${dupsOf(o).length?`<div style="color:var(--warn);font-size:13px;font-weight:600">⚠️ Похоже на дубль: ${dupsOf(o).map(x=>"№"+x.num).join(", ")}</div>`:""}
      <div class="mute">${d(o.created_at)} · ${fmt(o.sale_tjs)} TJS${debt>0.009?` · <b style="color:var(--bad)">долг ${fmt(debt)}</b>`:" · оплачено"}${o.tracking_no?` · ${esc(o.carrier||"")} ${esc(o.tracking_no)}`:""}${o.parcel_delivered_at?" · 📬 доставлено":""}${o.photo_url?" · 📷":""}</div></div>`}).join("") || '<p class="mute">Нет заказов</p>';
}
function ordersTab() {
  const os = S.data.orders, F = ordFilters(), cnt = st => os.filter(o=>o.stage===st).length;
  $("#tab").innerHTML = `
    <div class="stats">${STAGES.slice(0,6).map(([k,l])=>`<button class="${S.filter==="st:"+k?"on":""}" onclick="S.filter=S.filter==='st:${k}'?'active':'st:${k}';render()"><b>${cnt(k)}</b><span>${l}</span></button>`).join("")}</div>
    <div class="tabs">${Object.entries(F).map(([k,[l]])=>`<button class="${S.filter===k?"on":""}" onclick="S.filter='${k}';render()">${l}</button>`).join("")}</div>
    <input type="search" placeholder="Поиск: клиент, телефон, товар, трек…" value="${esc(S.q||"")}" oninput="S.q=this.value;$('#olist').innerHTML=listHtml()">
    <div id="olist">${listHtml()}</div>`;
}

function orderForm(o={}) {
  const users = (S.data.users||[]).filter(u=>u.role==="worker");
  const v = k => esc(o[k] ?? "");
  const dups = o.id ? dupsOf(o) : [];
  const html = `<h3 style="margin-top:0">${o.id?`Заказ №${o.num}`:"Новая продажа"}</h3>
   ${dups.map(x=>`<div class="warn">⚠️ Похоже, это тот же заказ, что <b>№${x.num}</b> · ${esc(x.client_name||"без клиента")} · ${esc(x.shop||"")} · ${esc((x.items||"").slice(0,60))}${x.shop_order_no?` (№ ${esc(x.shop_order_no)})`:""}
     <div class="row" style="margin-top:8px"><button onclick="mergeInto('${o.id}','${x.id}')">Объединить №${x.num} сюда</button><button class="ghost" onclick="openOrder('${x.id}')">Открыть №${x.num}</button></div></div>`).join("")}
   <div class="grid2"><div><label>Клиент *</label><input id="f_client_name" value="${v("client_name")}"></div>
   <div><label>Телефон</label><input id="f_client_phone" inputmode="tel" value="${v("client_phone")}"></div></div>
   <label>Товар(ы) *</label><textarea id="f_items" rows="2">${v("items")}</textarea>
   <div class="grid2"><div><label>Цена клиенту, TJS</label><input id="f_sale_tjs" inputmode="decimal" value="${v("sale_tjs")}"></div>
   ${o.id?`<div><label>Закупка, €</label><input id="f_purchase_eur" inputmode="decimal" value="${v("purchase_eur")}"></div>`:
   `<div><label>Уже оплачено, TJS</label><input id="f_paid" inputmode="decimal"></div>`}</div>
   ${o.id?"":`<label>Закупка, € (если уже известна)</label><input id="f_purchase_eur" inputmode="decimal">`}
   <div class="grid2"><div><label>Магазин</label><input id="f_shop" value="${v("shop")}" placeholder="dm, Amazon…"></div>
   <div><label>№ заказа в магазине</label><input id="f_shop_order_no" value="${v("shop_order_no")}" placeholder="из письма магазина"></div></div>
   <div class="mute">№ заказа магазина нужен, чтобы письма о доставке сами привязывались к этому заказу.</div>
   <div class="grid2"><div><label>Получение</label><select id="f_delivery_mode"><option value="pickup">Самовывоз</option><option value="address" ${o.delivery_mode==="address"?"selected":""}>Доставка на адрес</option></select></div>
   <div><label>Адрес в Таджикистане</label><input id="f_address" value="${v("address")}"></div></div>
   <div class="grid2"><div><label>Служба доставки</label><input id="f_carrier" value="${v("carrier")}" placeholder="DHL, Hermes, DPD…"></div>
   <div><label>Трек-номер</label><input id="f_tracking_no" value="${v("tracking_no")}"></div></div>
   <div class="grid2"><div><label>Работник</label><select id="f_worker_id"><option value="">—</option>${users.map(u=>`<option value="${u.id}" ${o.worker_id===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div>
   <div><label>Дата рейса</label><input id="f_flight_date" type="date" value="${v("flight_date")}"></div></div>
   <label>Заметки</label><textarea id="f_notes" rows="2">${v("notes")}</textarea>
   <div class="row" style="margin-top:12px"><button id="save">Сохранить</button>${o.id?`<button class="ghost" onclick="$('#dlg').close()">Закрыть</button>`:""}</div>`;
  const box = o.id ? $("#dlgIn") : $("#tab");
  box.innerHTML = o.id ? html + orderExtras(o) : `<div class="card">${html}</div>`;
  $("#save").onclick = async () => {
    const f = {}; ["client_name","client_phone","items","sale_tjs","purchase_eur","shop","shop_order_no","delivery_mode","address","carrier","tracking_no","worker_id","flight_date","notes"]
      .forEach(k=>{ const e=$("#f_"+k); if(e) f[k]=e.value.trim().replace(/^(\d+),(\d+)$/,"$1.$2"); });
    if (o.id) f.id=o.id;
    try { const r = await call("save_order",{order:f, paid_tjs:($("#f_paid")?.value||"").replace(",",".")});
      if (!o.id && f.tracking_no) await call("set_stage",{id:r.order.id, stage:"shipped"});
      toast(r.matched?`Сохранено ✓ · привязано писем: ${r.matched}`:"Сохранено ✓"); if(o.id) $("#dlg").close(); else S.tab="orders"; await load(); } catch(e){ toast(e.message); }
  };
}

function orderExtras(o) {
  const pays = (S.data.payments||[]).filter(p=>p.order_id===o.id), paid = paidOf(o.id);
  const mi = mailItems(o);
  return `   ${mi && norm(mi)!==norm(o.items)?`<div class="card" style="margin:10px 0"><b>📦 Товары по письму магазина</b><div>${esc(mi)}</div><button class="ghost" style="margin-top:8px" onclick="$('#f_items').value=${esc(JSON.stringify(mi))};toast('Вставлено — нажмите «Сохранить»')">Вставить в «Товар(ы)»</button></div>`:""}
   <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
   <b>Этап:</b> ${stageChip(o)} <span class="mute">с ${d(o.stage_at)}</span> ${trackBtn(o)}
   <div class="row" style="margin-top:8px">${STAGES.filter(([k])=>k!==o.stage).map(([k,l])=>`<button class="${k==="cancelled"?"bad":"ghost"}" onclick="setStage('${o.id}','${k}')">${l}</button>`).join("")}</div>
   ${o.photo_url?`<img class="ph" src="${o.photo_url}">`:""}
   ${o.parcel_delivered_at?`<p>📬 Служба доставки отметила посылку доставленной ${d(o.parcel_delivered_at)}</p>`:""}
   ${mailSummaryHtml(o)}
   <h4>Оплаты: ${fmt(paid)} из ${fmt(o.sale_tjs)} TJS</h4>
   ${pays.map(p=>`<div class="mute">${d(p.paid_at)} · ${fmt(p.amount_tjs)} TJS ${esc(p.note||"")}</div>`).join("")}
   <div class="row" style="margin-top:8px"><input id="payAmt" inputmode="decimal" placeholder="Сумма, TJS" style="flex:1"><button class="ok" onclick="addPay('${o.id}')">+ Оплата</button></div>`;
}
function openOrder(id) { const o=S.data.orders.find(x=>x.id===id); orderForm(o); $("#dlg").showModal(); }
async function addPay(id) {
  const a = +($("#payAmt").value||"").replace(",","."); if(!a) return toast("Введите сумму");
  try { await call("add_payment",{order_id:id, amount_tjs:a}); toast("Оплата добавлена ✓"); await load(); openOrder(id); } catch(e){ toast(e.message); }
}

/* ---------- письма ---------- */
const KIND = {order:"🧾 заказ оформлен", shipped:"🚚 отправлено", delivered:"📬 доставлено"};
const unmatched = () => (S.data.mails||[]).filter(m=>m.status==="unmatched");
const mailsOf = id => (S.data.mails||[]).filter(m=>m.order_id===id && m.status!=="duplicate");
const dupMailsOf = id => (S.data.mails||[]).filter(m=>m.order_id===id && m.status==="duplicate");
const mailItems = o => { const m = mailsOf(o.id).filter(x=>x.items_text).sort((a,b)=>a.received_at<b.received_at?-1:1)[0]; return m ? m.items_text : null; };
const short = t => t && t.length>12 ? "…"+t.slice(-6) : (t||"");
// сводка: по одной строке на этап вместо десятка писем
function mailGroups(o) {
  const ms = mailsOf(o.id).slice().sort((a,b)=>a.received_at<b.received_at?-1:1), g = {};
  for (const m of ms) { const k = m.kind||"other"; (g[k] ||= {kind:k, first:m.received_at, last:m.received_at, n:0, tr:new Set(), car:new Set(), eur:null});
    const x=g[k]; x.n++; x.last=m.received_at; if(m.tracking_no) x.tr.add(m.tracking_no); if(m.carrier) x.car.add(m.carrier); if(m.amount_eur&&!x.eur) x.eur=m.amount_eur; }
  return ["order","shipped","delivered","other"].map(k=>g[k]).filter(Boolean);
}
function mailLine(o) {
  const gs = mailGroups(o); if (!gs.length) return "";
  const last = gs[gs.length-1];
  return `<div class="mute">✉️ ${gs.map(x=>`${(KIND[x.kind]||"✉️ письмо").split(" ")[0]} ${d(x.kind==="shipped"?x.first:x.last)}`).join(" → ")} · писем: ${gs.reduce((a,x)=>a+x.n,0)}</div>`;
}
function mailSummaryHtml(o) {
  const gs = mailGroups(o), dups = dupMailsOf(o.id).length; if (!gs.length) return "";
  const lbl = {order:"🧾 Заказ оформлен", shipped:"🚚 Отправлено", delivered:"📬 Доставлено", other:"✉️ Другие письма"};
  return `<h4 style="margin-bottom:4px">Сводка по письмам</h4><ul class="tl">${gs.map(x=>`<li><b>${lbl[x.kind]}</b> ${d(x.first)}${x.last!==x.first&&x.kind!=="order"?` · последнее ${d(x.last)}`:""}
     <div class="mute">${[[...x.car].join(", "), x.tr.size?"трек "+[...x.tr].map(esc).join(", "):"", x.eur?fmt(x.eur)+" €":"", x.n>1?`${x.n} писем`:""].filter(Boolean).join(" · ")}</div></li>`).join("")}</ul>
   <details><summary>Все письма (${mailsOf(o.id).length})${dups?` · повторы скрыты: ${dups}`:""}</summary>${mailsOf(o.id).map(m=>`<div class="mute">${d(m.received_at)} · ${KIND[m.kind]||"письмо"} · ${esc(m.subject)}</div>`).join("")}</details>`;
}
/* ---------- дубли заказов ---------- */
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9а-яё]/g,"");
const dg = s => String(s||"").replace(/\D/g,"");
const SKIP = new Set(["the","shop","store","team","customer","service","de","com","online"]);
const shopKey = o => { const w = String(o.shop||o.shop_domain||"").toLowerCase().split(/[^a-z0-9а-яё]+/).filter(x=>x&&!SKIP.has(x)); return w[0]||""; };
function isDup(a, b) {
  if (a.id===b.id || a.stage==="cancelled" || b.stage==="cancelled") return false;
  if (a.shop_order_no && b.shop_order_no && (norm(a.shop_order_no)===norm(b.shop_order_no) || (dg(a.shop_order_no).length>=7 && dg(a.shop_order_no)===dg(b.shop_order_no)))) return true;
  if (a.tracking_no && b.tracking_no && norm(a.tracking_no).length>=8 && norm(a.tracking_no)===norm(b.tracking_no)) return true;
  const days = Math.abs(new Date(a.created_at)-new Date(b.created_at))/864e5;
  if (shopKey(a) && shopKey(a)===shopKey(b) && days<=4) {
    if (a.client_name && b.client_name && norm(a.client_name)===norm(b.client_name)) return true;
    if (a.auto_created!==b.auto_created) { const [man,au] = a.auto_created?[b,a]:[a,b]; if (!man.shop_order_no && !au.client_name) return true; }
    if (a.items && b.items && norm(a.items)===norm(b.items)) return true;
  }
  return false;
}
const dupsOf = o => (S.data.orders||[]).filter(x=>isDup(o,x));
async function mergeInto(targetId, sourceId) {
  const t = S.data.orders.find(x=>x.id===targetId), s = S.data.orders.find(x=>x.id===sourceId);
  if (!confirm(`Объединить №${s.num} в №${t.num}?\nПисьма и оплаты перейдут в №${t.num}, пустые поля заполнятся из №${s.num}, а №${s.num} исчезнет из списка.`)) return;
  try { await call("merge_orders",{target_id:targetId, source_id:sourceId}); toast(`Объединено в №${t.num} ✓`); await load(); openOrder(targetId); } catch(e){ toast(e.message); }
}
function mailGroupsUnmatched() {
  const g = new Map();
  for (const m of unmatched()) { const k = m.tracking_no ? "t:"+norm(m.tracking_no) : "s:"+norm(m.from_addr)+norm(m.subject);
    if (!g.has(k)) g.set(k, []); g.get(k).push(m); }
  return [...g.values()];
}
function mailsHtml() {
  const gs = mailGroupsUnmatched(), opts = S.data.orders.filter(o=>!["done","cancelled"].includes(o.stage));
  if (!gs.length) return '<p class="mute">Все письма привязаны к заказам ✓</p>';
  return `<p class="mute">Эти письма не удалось привязать автоматически. Письма об одной посылке собраны в одну карточку. Выберите заказ или скройте.</p>` +
    gs.map(ms=>{ const m = ms[0], ids = ms.map(x=>x.id).join(","); return `<div class="card"><div class="row"><h4 style="margin:0;flex:1">${esc(m.subject)}</h4><span class="chip">${KIND[m.kind]||"письмо"}</span></div>
      <div class="mute">${d(ms[ms.length-1].received_at)}${ms.length>1?`–${d(m.received_at)} · <b>${ms.length} писем</b>`:""} · ${esc(m.from_addr)}</div>
      <div class="mute">${m.carrier?esc(m.carrier)+" ":""}${m.tracking_no?"трек "+esc(m.tracking_no):""}${m.amount_eur?" · "+fmt(m.amount_eur)+" €":""}${m.items_text?" · "+esc(m.items_text):""}</div>
      <div class="row" style="margin-top:8px"><select id="ml_${m.id}" style="flex:1;min-width:180px"><option value="">— выберите заказ —</option>${opts.map(o=>`<option value="${o.id}">№${o.num} · ${esc(o.client_name||"?")} · ${esc(o.shop||"")} · ${esc((o.items||"").slice(0,30))}</option>`).join("")}</select>
      <button onclick="linkMail('${m.id}','${ids}')">Привязать</button><button class="ghost" onclick="hideMail('${ids}')">Скрыть</button></div></div>`}).join("");
}
async function linkMail(mid, ids) {
  const oid = $("#ml_"+mid).value; if (!oid) return toast("Выберите заказ");
  try { await call("link_mail",{mail_ids:ids.split(","), order_id:oid}); toast("Привязано ✓"); await load(); } catch(e){ toast(e.message); }
}
async function hideMail(ids) { try { await call("hide_mail",{mail_ids:ids.split(",")}); await load(); } catch(e){ toast(e.message); } }

/* ---------- money ---------- */
function periodRange(p) {
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  if (p==="week") { const s=new Date(n); s.setDate(n.getDate()-((n.getDay()+6)%7)); s.setHours(0,0,0,0); return [s,null]; }
  if (p==="month") return [new Date(y,m,1),null];
  if (p==="prev") return [new Date(y,m-1,1),new Date(y,m,1)];
  return [new Date(0),null];
}
function moneyTab() {
  const [a,b] = periodRange(S.period), inP = s => { const t=new Date(s); return t>=a && (!b||t<b); }, R = rate();
  const os = S.data.orders.filter(o=>o.stage!=="cancelled" && inP(o.created_at));
  const sales = os.reduce((s,o)=>s+ +o.sale_tjs,0);
  const buyE = os.reduce((s,o)=>s+ +(o.purchase_eur||0),0), noBuy = os.filter(o=>o.purchase_eur==null).length;
  const got = (S.data.payments||[]).filter(p=>inP(p.paid_at)).reduce((s,p)=>s+ +p.amount_tjs,0);
  const ex = (S.data.expenses||[]).filter(e=>inP(e.spent_at));
  const exT = ex.reduce((s,e)=>s+(e.currency==="EUR"? e.amount*R : +e.amount),0);
  const profit = sales - buyE*R - exT;
  const debtors = S.data.orders.filter(o=>o.stage!=="cancelled").map(o=>({o,debt:+o.sale_tjs-paidOf(o.id)})).filter(x=>x.debt>0.009);
  const debtSum = debtors.reduce((s,x)=>s+x.debt,0);
  const P = {week:"Неделя",month:"Этот месяц",prev:"Прошлый месяц",all:"Всё время"};
  $("#tab").innerHTML = `<div class="tabs">${Object.entries(P).map(([k,l])=>`<button class="${S.period===k?"on":""}" onclick="S.period='${k}';render()">${l}</button>`).join("")}</div>
   <div class="kpis">
    <div class="kpi"><div class="mute">Продажи (${os.length} зак.)</div><div class="v">${fmt(sales)} TJS</div></div>
    <div class="kpi"><div class="mute">Получено денег</div><div class="v">${fmt(got)} TJS</div></div>
    <div class="kpi"><div class="mute">Закупка</div><div class="v">${fmt(buyE)} €</div><div class="mute">≈ ${fmt(buyE*R)} TJS${noBuy?` · без цены: ${noBuy}`:""}</div></div>
    <div class="kpi"><div class="mute">Расходы на доставку</div><div class="v">${fmt(exT)} TJS</div></div>
    <div class="kpi"><div class="mute">Прибыль</div><div class="v" style="color:${profit>=0?"var(--ok)":"var(--bad)"}">${fmt(profit)} TJS</div></div>
    <div class="kpi"><div class="mute">Долги клиентов (всего)</div><div class="v" style="color:var(--bad)">${fmt(debtSum)} TJS</div></div>
   </div>
   <p class="mute">Курс: 1 € = ${R} TJS (меняется в «Настройках»). Прибыль = продажи − закупка − расходы.${noBuy?" Заказы без цены закупки считаются как 0 €.":""}</p>
   <div class="card"><b>По заказам</b><table><tr><th>№</th><th>Клиент</th><th class="n">Продажа</th><th class="n">Закупка</th><th class="n">Маржа</th></tr>
    ${os.map(o=>`<tr class="o" onclick="openOrder('${o.id}')"><td>${o.num}</td><td>${esc(o.client_name)}</td><td class="n">${fmt(o.sale_tjs)}</td><td class="n">${o.purchase_eur==null?"—":fmt(o.purchase_eur)+" €"}</td><td class="n">${o.purchase_eur==null?"—":fmt(o.sale_tjs-o.purchase_eur*R)}</td></tr>`).join("")}</table></div>
   <div class="card"><b>Должники</b><table>${debtors.map(x=>`<tr class="o" onclick="openOrder('${x.o.id}')"><td>№${x.o.num} ${esc(x.o.client_name)}</td><td class="mute">${esc(x.o.client_phone||"")}</td><td class="n" style="color:var(--bad)">${fmt(x.debt)} TJS</td></tr>`).join("")||'<tr><td class="mute">Долгов нет</td></tr>'}</table></div>
   <div class="card"><b>Расходы</b>
    <div class="grid2"><div><label>Категория</label><select id="e_cat">${Object.entries(EXP).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
    <div><label>Дата</label><input id="e_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div><label>Сумма</label><input id="e_amt" inputmode="decimal"></div>
    <div><label>Валюта</label><select id="e_cur"><option>EUR</option><option>TJS</option></select></div></div>
    <label>Комментарий</label><input id="e_note" placeholder="напр. рейс 12.10, 8 кг">
    <button style="margin-top:10px" onclick="addExp()">+ Расход</button>
    <table style="margin-top:10px">${ex.map(e=>`<tr><td>${d(e.spent_at)}</td><td>${EXP[e.category]}<div class="mute">${esc(e.note||"")}</div></td><td class="n">${fmt(e.amount)} ${e.currency}</td><td class="n"><button class="ghost" onclick="delExp('${e.id}')">✕</button></td></tr>`).join("")}</table></div>`;
}
async function addExp() {
  const amount = +($("#e_amt").value||"").replace(",","."); if(!amount) return toast("Введите сумму");
  try { await call("add_expense",{expense:{category:$("#e_cat").value, spent_at:$("#e_date").value, amount, currency:$("#e_cur").value, note:$("#e_note").value}}); toast("Добавлено ✓"); await load(); } catch(e){ toast(e.message); }
}
async function delExp(id) { try { await call("delete_expense",{id}); await load(); } catch(e){ toast(e.message); } }

function settingsTab() {
  const s = S.data.settings||{};
  $("#tab").innerHTML = `<div class="card"><label>Курс: 1 € = ? TJS</label><input id="s_rate" inputmode="decimal" value="${esc(s.eur_tjs)}">
   <label>Считать задержкой, если заказ стоит на одном этапе больше (дней)</label><input id="s_delay" inputmode="numeric" value="${esc(s.delay_days)}">
   <button style="margin-top:12px" onclick="saveSet()">Сохранить</button></div>
   <div class="card"><b>Письма</b><p class="mute">Заново разобрать все письма: убрать повторы и рассылки, привязать письма служб доставки к заказам, подтянуть товары из писем магазинов. Ручные правки в заказах не трогаются.</p>
   <button class="ghost" onclick="reproc()">🔄 Перепроверить все письма</button></div>`;
}
async function reproc() {
  toast("Проверяю письма…");
  try { const r = await call("reprocess_mail"); const st = r.stats||{}; toast(`Готово: привязано ${(st.matched||0)}, повторов ${(st.duplicate||0)}, новых заказов ${(st.created||0)}`); await load(); } catch(e){ toast(e.message); }
}
async function saveSet() {
  try { await call("set_setting",{key:"eur_tjs", value:$("#s_rate").value.replace(",",".")}); await call("set_setting",{key:"delay_days", value:$("#s_delay").value}); toast("Сохранено ✓"); await load(); } catch(e){ toast(e.message); }
}

/* ---------- start ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
S.pin = store.get("bm_pin");
S.pin ? load().catch(()=>{ S.pin=null; loginView(); }) : loginView();
</script>
</body>
</html>
